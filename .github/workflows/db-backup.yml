# Nightly encrypted database backups (broad-scan F1)
#
# Dumps BOTH Neon databases (Perfin + Per-sistant) with pg_dump, encrypts
# each dump with AES-256 (gpg symmetric — the ciphertext carries an integrity
# check, so a corrupted or altered file fails to decrypt instead of restoring
# garbage), VERIFIES each one by decrypting the whole file and then reading its
# table of contents with pg_restore --list, and stores them as GitHub Actions artifacts
# with 90-day retention. Runs independently of the app server, so backups
# happen even while the Render free tier is asleep.
#
# Cycle 7 (Oct 2026): every run before then failed — the secrets below were
# never set (F3) — so NO backup existed. The first step now names any missing
# secret. GitHub also disables a public repo's scheduled workflows after 60
# days without repository activity (F4): re-enable it under Actions →
# Database Backup if it shows "disabled", and keep the repo private.
#
# Required repository secrets:
#   NEON_DATABASE_URL            — Perfin's Postgres connection string
#   PERSISTENT_DATABASE_URL      — Per-sistant's Postgres connection string
#                                  (optional; the step skips if unset)
#   BACKUP_ENCRYPTION_PASSPHRASE — passphrase for the AES-256 encryption.
#                                  Store a copy OUTSIDE GitHub (password
#                                  manager) — without it the backups are
#                                  unreadable.
#
# ── RESTORE RUNBOOK ─────────────────────────────────────────────────────────
# 1. Download the artifact from the workflow run (Actions → Database Backup →
#    pick a run → Artifacts) and unzip it.
# 2. Decrypt (prompts for BACKUP_ENCRYPTION_PASSPHRASE; refuses a damaged file):
#      gpg --decrypt --output perfin.dump perfin-YYYY-MM-DD.dump.gpg
# 3. Restore into a fresh database (Neon: create a new database/branch first):
#      pg_restore --clean --if-exists --no-owner --no-privileges \
#        -d "$NEW_DATABASE_URL" perfin.dump
# 4. Point NEON_DATABASE_URL (or PERSISTENT_DATABASE_URL) at the restored DB
#    and redeploy. Teller/Plaid tokens restore with the data — they're
#    encrypted with TOKEN_ENCRYPTION_PASSPHRASE, which must be unchanged.
# 5. Do a restore drill once: restore into a throwaway Neon branch and boot
#    the app against it, so step 3 isn't attempted for the first time during
#    an actual emergency.
# ────────────────────────────────────────────────────────────────────────────

name: Database Backup

on:
  schedule:
    - cron: '23 8 * * *'   # daily, 8:23 AM UTC (offset to avoid load spikes)
  workflow_dispatch:        # manual trigger

# Read-only token: nothing here writes to the repository (cycle-7 F16).
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # Shared by both dump steps: dump, encrypt, then verify the ENCRYPTED file
      # decrypts and is a readable pg_dump archive. Usage: backup_db <name> <url>
      #
      # The verify is two steps, never a pipe (cycle-9 F1): `gpg --decrypt | pg_restore
      # --list` failed on every dump larger than one pipe buffer — pg_restore
      # stops reading after the table of contents, gpg dies writing the rest
      # ("Broken pipe") and pipefail failed the step before anything was uploaded.
      # Decrypting to a file first also makes gpg's integrity check cover the
      # WHOLE file: a truncated or altered backup fails here.
      #
      # pg_dump's own error text is never printed (cycle-9 F12): it names the
      # database host, and this repository's logs can be public. The step says
      # which kind of failure it was instead.
      BACKUP_FN: |
        set -o pipefail
        backup_db() {
          local name="$1" url="$2" date out reason
          date=$(date -u +%F)
          out="$name-$date.dump.gpg"
          if ! pg_dump "$url" --no-owner --no-privileges --format=custom --file="$name.dump" 2> "$name.err"; then
            reason="run pg_dump with the same connection string on your own machine to see why"
            if grep -qi "version mismatch" "$name.err"; then
              reason="the pg_dump client is older than the database server — raise the PostgreSQL client version this workflow installs"
            elif grep -qiE "password authentication failed|no pg_hba\.conf entry|role .* does not exist" "$name.err"; then
              reason="the database refused the credentials in the connection-string secret"
            elif grep -qiE "could not translate host name|could not connect|connection .* failed|timeout|timed out" "$name.err"; then
              reason="the database could not be reached"
            elif grep -qi "permission denied" "$name.err"; then
              reason="the role in the connection-string secret cannot read every table"
            fi
            rm -f "$name.dump" "$name.err"
            echo "::error::pg_dump of the $name database failed: $reason. (pg_dump's own message is withheld — it can name the host.)"
            return 1
          fi
          rm -f "$name.err"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --s2k-digest-algo SHA512 --s2k-count 65011712 --output "$out" "$name.dump"
          rm "$name.dump"
          if ! printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$name.verify" "$out" 2> /dev/null; then
            rm -f "$name.verify" "$out"
            echo "::error::The encrypted $name backup did not decrypt cleanly — nothing was uploaded for it."
            return 1
          fi
          if ! pg_restore --list "$name.verify" > /dev/null 2>&1; then
            rm -f "$name.verify" "$out"
            echo "::error::The $name backup decrypted but is not a readable pg_dump archive — nothing was uploaded for it."
            return 1
          fi
          rm "$name.verify"
          echo "$out: $(du -h "$out" | cut -f1), verified (decrypts in full + pg_restore --list)"
        }
    steps:
      - name: Check secrets
        env:
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$DB_URL" ] || missing="$missing NEON_DATABASE_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_ENCRYPTION_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Repository secret(s) not set:$missing — add them under Settings → Secrets and variables → Actions. No backup can be taken until then."
            exit 1
          fi

      - name: Install PostgreSQL 17 client (matches Neon's server major)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump + encrypt + verify Perfin database
        env:
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          eval "$BACKUP_FN"
          backup_db perfin "$DB_URL"

      # Seams audit #4 B3: under the unified shell Per-sistant has its own
      # database (the shell refuses to boot without one), so a missing secret
      # means it isn't backed up. The step still passes (a standalone Perfin
      # has no second database) but says so, and the record below names it, so
      # Operator Checks warns instead of reporting both databases backed up.
      - name: Dump + encrypt + verify Per-sistant database
        id: persistent
        env:
          DB_URL: ${{ secrets.PERSISTENT_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::warning::PERSISTENT_DATABASE_URL secret not set — Per-sistant's database was NOT backed up (fine only for a standalone Perfin)."
            echo "dumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eval "$BACKUP_FN"
          backup_db persistent "$DB_URL"
          echo "dumped=true" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backups
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: '*.dump.gpg'
          retention-days: 90
          if-no-files-found: error

      # Cycle-8 E4a (ST5): record the verified backup in user_settings so Settings
      # → Sync Health → Operator Checks sees it without a GitHub token. Runs only
      # after both dumps were verified and uploaded (an earlier failure stops the
      # job). Prints nothing — psql is quiet and its errors are discarded (they can
      # name the host); a failed stamp is a warning, not a failed backup. The
      # source says whether Per-sistant's database was in it (B3): 'github' for
      # both, 'github-perfin-only' when its secret wasn't set.
      - name: Record the backup
        env:
          DB_URL: ${{ secrets.NEON_DATABASE_URL }}
          PERSISTENT_DUMPED: ${{ steps.persistent.outputs.dumped }}
        run: |
          SOURCE=github
          [ "$PERSISTENT_DUMPED" = "true" ] || SOURCE=github-perfin-only
          if psql "$DB_URL" -qtAc "UPDATE user_settings SET last_backup_at = now(), last_backup_source = '$SOURCE' WHERE id = 1" >/dev/null 2>&1; then
            echo "Backup recorded."
          else
            echo "::warning::Couldn't record the backup time in the database — Operator Checks will report the backup as missing."
          fi
