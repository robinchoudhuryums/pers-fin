# Job Radar weekly refresh — ingests sanctioned job sources, dedups, and runs
# the trust/fit passes. Backstop for the in-process weekly node-cron so the
# refresh still happens while the Render free tier is asleep (the request wakes
# it). All writes are idempotent (content_hash upsert), so overlap with the
# in-process cron is harmless.
#
# Requires these repository secrets:
#   SERVER_URL  — e.g. https://pers-fin-tracker.onrender.com
#   API_KEY     — the API key set on the server (shell validates x-api-key)

name: Job Radar Refresh

on:
  schedule:
    - cron: '47 9 * * 1'   # Mondays 09:47 UTC — after the in-process 07:23 cron (F117:
                           # same minute = two overlapping, double-scored runs); the
                           # endpoint skips when a refresh ran in the last 6 hours
  workflow_dispatch:        # manual trigger

# Read-only token: nothing here writes to the repository (cycle-7 F16).
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # PUBLIC-LOG SAFETY (F2): this repo's Actions logs are world-readable
    # while the repo is public, so response bodies are never printed — they
    # carry account names, balances, net worth and merchant names. SUMMARY_JS
    # prints only the listed keys: numbers/booleans as-is, arrays as a count,
    # strings only when the key is suffixed ":str". Details live in the app
    # (Settings -> Sync Health).
    env:
      # CHECK_STATUS reports a curl timeout or unreachable server ("000") as an
      # error annotation instead of the step dying silently under `bash -e`
      # (Batch 3 follow-on). Usage: check_status <label> <status> [expected…]
      CHECK_STATUS: |
        check_status() {
          local label="$1" status="$2"; shift 2
          if [ "$status" = "000" ]; then
            echo "::error::$label: no response (timed out or server unreachable). The server may still be working."
            return 1
          fi
          for ok in "${@:-200}"; do [ "$status" = "$ok" ] && { echo "$label: HTTP $status"; return 0; }; done
          echo "::error::$label failed with HTTP $status"
          return 1
        }
      SUMMARY_JS: |
        const fs = require("fs");
        const [file, ...keys] = process.argv.slice(1);
        let d;
        try { d = JSON.parse(fs.readFileSync(file, "utf8")); } catch { console.log("(no JSON body)"); process.exit(0); }
        for (const k of keys) {
          const str = k.endsWith(":str");
          const path = (str ? k.slice(0, -4) : k).split(".");
          let v = d;
          for (const p of path) v = v && typeof v === "object" ? v[p] : undefined;
          const name = path.join(".");
          if (Array.isArray(v)) console.log(name + ": " + v.length);
          else if (typeof v === "number" || typeof v === "boolean") console.log(name + ": " + v);
          else if (str && typeof v === "string") console.log(name + ": " + v.slice(0, 40));
        }
    steps:
      - name: Wake server (Render free tier cold start)
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SERVER_URL }}/health" || true
          sleep 10

      - name: Trigger Job Radar refresh
        run: |
          # Job Radar runs under the Per-sistant sub-app behind the unified
          # shell; the shell's requireAuth honors x-api-key. Returns 200 with a
          # JSON summary; a non-200 fails the job so the run is visible.
          eval "$CHECK_STATUS"
          STATUS=$(curl -s -o /tmp/jobradar.json -w "%{http_code}" --max-time 600 \
            -X POST "${{ secrets.SERVER_URL }}/per-sistant/api/jobs/refresh" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json") || true
          node -e "$SUMMARY_JS" /tmp/jobradar.json ok skipped:str fetched added scored fit_scored legitimacy_reviewed capped purged
          check_status "Job Radar refresh" "$STATUS"
