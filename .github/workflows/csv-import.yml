name: CSV Import

on:
  push:
    paths:
      - 'csv-uploads/*.csv'

# The cleanup step pushes a commit; without this a repo whose default
# GITHUB_TOKEN permission is read-only fails the push (PSC-15).
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      # A bank CSV pushed to a PUBLIC repo is published the moment it lands —
      # importing and `git rm`-ing it afterwards doesn't take it back (F2).
      # Fail loudly so this path is never used while the repo is public; make
      # the repo private (or upload through the app's CSV import instead).
      - name: Refuse CSV uploads to a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::This repository is public — bank CSVs pushed here are publicly visible. Make the repo private, delete the upload commit from history (git filter-repo), and use the in-app CSV import instead."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The CLI exits 1 when any file fails and lists the files that DID import
      # in $CSV_IMPORTED_LIST (cycle-7 F19).
      - name: Import CSV files
        id: import
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.TOKEN_ENCRYPTION_PASSPHRASE }}
          CSV_IMPORTED_LIST: ${{ runner.temp }}/csv-imported.txt
        run: node scripts/import-csv-cli.js csv-uploads/

      - name: Sync to Google Sheets
        if: success()
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.TOKEN_ENCRYPTION_PASSPHRASE }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/sheets-sync.js
        continue-on-error: true

      # Remove the imported bank CSVs from the tree rather than archiving them
      # under csv-uploads/processed/ (PSC-15): an in-repo archive kept raw bank
      # statements in every future checkout. The rows now live in the database
      # (and Sheets); the upload commit itself is still in history, so delete
      # it with `git filter-repo` if that matters to you.
      # Only the files the CLI reports as imported are removed — a file that
      # failed stays in csv-uploads/ (and the run is red) so nothing is lost
      # (F19). Runs after a partial failure too, so the good files still go.
      - name: Remove processed CSVs
        if: ${{ !cancelled() && (steps.import.outcome == 'success' || steps.import.outcome == 'failure') }}
        env:
          CSV_IMPORTED_LIST: ${{ runner.temp }}/csv-imported.txt
        run: |
          if [ ! -f "$CSV_IMPORTED_LIST" ]; then echo "No import manifest — removing nothing."; exit 0; fi
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then git rm -q -- "$f"; fi
          done < "$CSV_IMPORTED_LIST"

      - name: Commit cleanup
        if: ${{ !cancelled() && (steps.import.outcome == 'success' || steps.import.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Auto-import: remove processed CSVs"
          git push
