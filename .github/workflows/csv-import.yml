name: CSV Import

on:
  push:
    paths:
      - 'csv-uploads/*.csv'

# The cleanup step pushes a commit; without this a repo whose default
# GITHUB_TOKEN permission is read-only fails the push (PSC-15).
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Import CSV files
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.TOKEN_ENCRYPTION_PASSPHRASE }}
        run: node scripts/import-csv-cli.js csv-uploads/

      - name: Sync to Google Sheets
        if: success()
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.TOKEN_ENCRYPTION_PASSPHRASE }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/sheets-sync.js
        continue-on-error: true

      # Remove the imported bank CSVs from the tree rather than archiving them
      # under csv-uploads/processed/ (PSC-15): an in-repo archive kept raw bank
      # statements in every future checkout. The rows now live in the database
      # (and Sheets); the upload commit itself is still in history, so delete
      # it with `git filter-repo` if that matters to you.
      - name: Remove processed CSVs
        run: |
          for f in csv-uploads/*.csv; do
            if [ -f "$f" ]; then git rm -q "$f"; fi
          done

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Auto-import: remove processed CSVs"
          git push
