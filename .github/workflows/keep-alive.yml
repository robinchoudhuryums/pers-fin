# External keep-alive ping for Render free tier
# Runs every 14 minutes and checks the server's configured schedule
# before pinging. The server's keep_alive_start/end/timezone settings
# control when pings are active — this cron just provides the external
# trigger that Render requires (self-pings don't prevent sleep).
#
# Requires repository secrets:
#   SERVER_URL — e.g. https://pers-fin-tracker.onrender.com
#   API_KEY    — the app's API_KEY (the schedule endpoint is behind the shell gate)

name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 minutes
  workflow_dispatch:          # manual trigger

# Read-only token: nothing here writes to the repository (cycle-7 F16).
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check schedule and ping
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          # CHECK_STATUS reports a curl timeout or unreachable server ("000") as an
          # error annotation instead of the step dying silently under `bash -e`.
          # Usage: check_status <label> <status> [expected…]
          CHECK_STATUS: |
            check_status() {
              local label="$1" status="$2"; shift 2
              if [ "$status" = "000" ]; then
                echo "::error::$label: no response (timed out or server unreachable). The server may still be working."
                return 1
              fi
              for ok in "${@:-200}"; do [ "$status" = "$ok" ] && { echo "$label: HTTP $status"; return 0; }; done
              echo "::error::$label failed with HTTP $status"
              return 1
            }
          # FETCH_SCHEDULE asks the server for its keep-alive schedule and leaves
          # the HTTP status in SCHEDULE_STATUS (cycle-9 F10). A sleeping host can
          # take a minute to wake, so an unanswered or 5xx call is retried
          # (SCHEDULE_TRIES times, SCHEDULE_RETRY_SECONDS apart); a rejected one
          # (401 / 403 / 404) is not. Usage: fetch_schedule <output file>
          FETCH_SCHEDULE: |
            fetch_schedule() {
              local out="$1" attempt=1
              SCHEDULE_STATUS=000
              while :; do
                SCHEDULE_STATUS=$(curl -s -o "$out" -w "%{http_code}" --max-time "${SCHEDULE_MAX_TIME:-60}" \
                  -H "x-api-key: $API_KEY" \
                  "$SERVER_URL/perfin/api/keep-alive-schedule" 2>/dev/null) || true
                [ -n "$SCHEDULE_STATUS" ] || SCHEDULE_STATUS=000
                case "$SCHEDULE_STATUS" in
                  000|5??) ;;
                  *) return 0 ;;
                esac
                [ "$attempt" -ge "${SCHEDULE_TRIES:-3}" ] && return 0
                attempt=$((attempt + 1))
                sleep "${SCHEDULE_RETRY_SECONDS:-10}"
              done
            }
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "SERVER_URL secret not set, skipping"
            exit 0
          fi
          eval "$CHECK_STATUS"
          eval "$FETCH_SCHEDULE"

          # Fetch keep-alive schedule from server (may wake it from cold start).
          # Endpoint lives under /perfin/* now that Perfin runs as a sub-app
          # behind the unified shell. The schedule route is public on the
          # Perfin side, but the shell auth gate fronts it — the shell treats
          # /perfin/api/keep-alive-schedule as auth-required, so we send the
          # API key the same way the daily-sync workflow does.
          # A call that is rejected or never answered FAILS the run (cycle-9
          # F10): it used to read as "disabled, skipping" and stay green, so a
          # wrong API_KEY secret or a server that was down looked like a
          # keep-alive that was switched off. The body is never printed.
          export SCHEDULE_FILE="${RUNNER_TEMP:-/tmp}/keep-alive-schedule.json"
          fetch_schedule "$SCHEDULE_FILE"
          if [ "$SCHEDULE_STATUS" = "401" ] || [ "$SCHEDULE_STATUS" = "403" ]; then
            echo "::error::Keep-alive: the server rejected the schedule call — check that the API_KEY repository secret matches the app's API_KEY."
          fi
          check_status "Keep-alive schedule" "$SCHEDULE_STATUS"
          ENABLED=$(python3 -c "import json,os; d=json.load(open(os.environ['SCHEDULE_FILE'])); print(d.get('enabled',False))" 2>/dev/null) || {
            echo "::error::Keep-alive: the schedule reply was not JSON — something other than the app answered."
            exit 1
          }

          if [ "$ENABLED" != "True" ]; then
            echo "Keep-alive disabled in settings, skipping"
            exit 0
          fi

          # Check if current time is within active hours
          ACTIVE=$(python3 -c "
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          d = json.load(open(os.environ['SCHEDULE_FILE']))
          start = int(d.get('start', 0))
          end = int(d.get('end', 0))
          tz_name = d.get('timezone', 'America/New_York')

          try:
              now = datetime.now(ZoneInfo(tz_name))
          except Exception:
              now = datetime.now(ZoneInfo('America/New_York'))

          hour = now.hour

          if start == end:
              print('True')  # 24/7
          elif start < end:
              print('True' if start <= hour < end else 'False')
          else:
              print('True' if hour >= start or hour < end else 'False')
          " 2>/dev/null || echo "True")

          if [ "$ACTIVE" != "True" ]; then
            echo "Outside active hours, skipping"
            exit 0
          fi

          # Ping health endpoint
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SERVER_URL/health") || true
          check_status "Ping" "${HTTP_CODE:-000}"
