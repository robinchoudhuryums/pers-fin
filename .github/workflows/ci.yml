name: CI

on:
  pull_request:
  push:
    branches: ['claude/subscription-tracker-plaid-WeQTA', 'main', 'master']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            teller/package-lock.json
            package-lock.json
      - run: cd teller && npm ci
      - run: npm ci
      - run: npm test
