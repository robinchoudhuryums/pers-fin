# Daily transaction sync + subscription detection
# Runs at 7 AM UTC, or manually via workflow_dispatch
# Requires these repository secrets:
#   SERVER_URL  — e.g. https://pers-fin-tracker.onrender.com
#   API_KEY     — the API key set on the server

name: Daily Sync & Alerts

on:
  schedule:
    - cron: '0 7 * * *'  # 7 AM UTC daily
  workflow_dispatch:       # manual trigger

# Read-only token: the steps only call the app's API (cycle-7 F16).
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # PUBLIC-LOG SAFETY (F2): this repo's Actions logs are world-readable
    # while the repo is public, so response bodies are never printed — they
    # carry account names, balances, net worth and merchant names. SUMMARY_JS
    # prints only the listed keys: numbers/booleans as-is, arrays as a count,
    # strings only when the key is suffixed ":str". Details live in the app
    # (Settings -> Sync Health).
    env:
      # Cycle-7 F5: every step after "Sync transactions" is an INDEPENDENT
      # backstop, so each runs with `if: ${{ !cancelled() }}` — one failed call
      # (nine timed-out syncs in Oct 2026) no longer skips the balance sync, the
      # net-worth snapshot and detection. CHECK_STATUS reports a curl timeout or
      # unreachable server ("000") as an error annotation instead of the step
      # dying silently under `bash -e`: usage `check_status <label> <status>`.
      CHECK_STATUS: |
        check_status() {
          if [ "$2" = "000" ]; then
            echo "::error::$1: no response (timed out or server unreachable). A long sync may still be finishing on the server — see Settings -> Sync Health."
            return 1
          fi
          if [ "$2" -ne 200 ]; then echo "::error::$1 failed with HTTP $2"; return 1; fi
          echo "$1: HTTP $2"
        }
      SUMMARY_JS: |
        const fs = require("fs");
        const [file, ...keys] = process.argv.slice(1);
        let d;
        try { d = JSON.parse(fs.readFileSync(file, "utf8")); } catch { console.log("(no JSON body)"); process.exit(0); }
        for (const k of keys) {
          const str = k.endsWith(":str");
          const path = (str ? k.slice(0, -4) : k).split(".");
          let v = d;
          for (const p of path) v = v && typeof v === "object" ? v[p] : undefined;
          const name = path.join(".");
          if (Array.isArray(v)) console.log(name + ": " + v.length);
          else if (typeof v === "number" || typeof v === "boolean") console.log(name + ": " + v);
          else if (str && typeof v === "string") console.log(name + ": " + v.slice(0, 40));
        }
    steps:
      - name: Wake server (Render free tier cold start)
        run: |
          # /health is public on the shell — no auth, no DB hit, just confirms
          # the process is up. Sleep gives the cold start a few seconds to
          # warm DB pools before the real work starts.
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SERVER_URL }}/health" || true
          sleep 10

      - name: Sync transactions
        run: |
          # Endpoints live under /perfin/* now that Perfin runs as a sub-app
          # behind the unified shell. The shell's requireAuth honors x-api-key
          # the same way Perfin's standalone middleware did. /api/sync covers
          # Teller AND Plaid transactions (+ one anomaly check over both).
          # 420s: a Plaid item re-walk after a long gap can exceed the old 240s.
          eval "$CHECK_STATUS"
          STATUS=$(curl -s -o /tmp/sync.json -w "%{http_code}" --max-time 420 \
            -X POST "${{ secrets.SERVER_URL }}/perfin/api/sync" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json") || true
          node -e "$SUMMARY_JS" /tmp/sync.json enrollments_synced transactions_added errors
          check_status "Transaction sync" "$STATUS"

      - name: Sync balances + holdings + investment flows
        if: ${{ !cancelled() }}
        run: |
          # One call refreshes Teller balances, Plaid balances/liabilities,
          # investment holdings, and external cash flows (TWR/XIRR) — the
          # in-process hourly job only runs while the server is awake, so this
          # guarantees at least daily freshness.
          eval "$CHECK_STATUS"
          STATUS=$(curl -s -o /tmp/balances.json -w "%{http_code}" --max-time 240 \
            -X POST "${{ secrets.SERVER_URL }}/perfin/api/sync-balances" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json") || true
          node -e "$SUMMARY_JS" /tmp/balances.json accounts_updated accounts_changed errors plaid_accounts_updated plaid_errors holdings_updated holdings_accounts_updated holdings_errors flows_added flows_errors
          check_status "Balance sync" "$STATUS"

      - name: Net worth snapshot
        if: ${{ !cancelled() }}
        run: |
          # Daily guaranteed snapshot (ON CONFLICT (snapshot_date) upsert —
          # the awake-hours in-process job just overwrites with fresher data).
          eval "$CHECK_STATUS"
          STATUS=$(curl -s -o /tmp/networth.json -w "%{http_code}" --max-time 120 \
            -X POST "${{ secrets.SERVER_URL }}/perfin/api/net-worth/snapshot" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json") || true
          # The body is the snapshot row incl. the per-account breakdown — never printed (F2).
          check_status "Net worth snapshot" "$STATUS"

      - name: Run subscription detection
        if: ${{ !cancelled() }}
        run: |
          eval "$CHECK_STATUS"
          STATUS=$(curl -s -o /tmp/detect.json -w "%{http_code}" --max-time 240 \
            -X POST "${{ secrets.SERVER_URL }}/perfin/api/detect" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json") || true
          node -e "$SUMMARY_JS" /tmp/detect.json detected_count
          check_status "Subscription detection" "$STATUS"

      - name: Check for new/changed subscriptions
        id: check
        if: ${{ !cancelled() }}
        run: |
          curl -s "${{ secrets.SERVER_URL }}/perfin/api/subscriptions?filter=all" \
            -H "x-api-key: ${{ secrets.API_KEY }}" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          subs = data.get('subscriptions', [])
          new_subs = [s for s in subs if s.get('is_new')]
          changed = [s for s in subs if s.get('amount_changed')]
          summary = data.get('summary', {})

          print(f\"Active: {summary.get('total_active', 0)}\")
          print(f\"New subscriptions: {len(new_subs)}\")
          print(f\"Price changes: {len(changed)}\")

          # Counts only — names and amounts stay in the app (F2: public logs).
          if new_subs:
              print(f'::warning::{len(new_subs)} new subscription(s) detected — see the Subscriptions page')
          if changed:
              print(f'::warning::{len(changed)} price change(s) detected — see the Subscriptions page')

          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'new_count={len(new_subs)}\n')
              f.write(f'changed_count={len(changed)}\n')
          " 2>/dev/null || echo "Subscription check completed"
