# Weekly self-healing reconcile — out-of-process guarantee.
# The in-process scheduler runs reconcileTeller(90) at most weekly, but only
# while the Render process is awake; this workflow guarantees the heal fires
# regardless. All writes are idempotent ON CONFLICT upserts (INV-05), the
# Teller watermark is never advanced, and the anomaly push is suppressed —
# so overlapping with an in-process run is harmless.
# Requires repo secrets: SERVER_URL, API_KEY (same as daily-sync.yml).

name: Weekly Reconcile

on:
  schedule:
    - cron: '0 9 * * 0'   # Sundays 9 AM UTC
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # PUBLIC-LOG SAFETY (F2): this repo's Actions logs are world-readable
    # while the repo is public, so response bodies are never printed — they
    # carry account names, balances, net worth and merchant names. SUMMARY_JS
    # prints only the listed keys: numbers/booleans as-is, arrays as a count,
    # strings only when the key is suffixed ":str". Details live in the app
    # (Settings -> Sync Health).
    env:
      SUMMARY_JS: |
        const fs = require("fs");
        const [file, ...keys] = process.argv.slice(1);
        let d;
        try { d = JSON.parse(fs.readFileSync(file, "utf8")); } catch { console.log("(no JSON body)"); process.exit(0); }
        for (const k of keys) {
          const str = k.endsWith(":str");
          const path = (str ? k.slice(0, -4) : k).split(".");
          let v = d;
          for (const p of path) v = v && typeof v === "object" ? v[p] : undefined;
          const name = path.join(".");
          if (Array.isArray(v)) console.log(name + ": " + v.length);
          else if (typeof v === "number" || typeof v === "boolean") console.log(name + ": " + v);
          else if (str && typeof v === "string") console.log(name + ": " + v.slice(0, 40));
        }
    steps:
      - name: Wake server (Render free tier cold start)
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SERVER_URL }}/health" || true
          sleep 10

      - name: Reconcile trailing 90 days (Teller)
        run: |
          STATUS=$(curl -s -o /tmp/reconcile.json -w "%{http_code}" --max-time 540 \
            -X POST "${{ secrets.SERVER_URL }}/perfin/api/sync/reconcile" \
            -H "x-api-key: ${{ secrets.API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"days": 90, "provider": "teller"}')
          echo "Reconcile status: $STATUS"
          node -e "$SUMMARY_JS" /tmp/reconcile.json days provider:str teller.enrollments_synced teller.transactions_added teller.errors
          if [ "$STATUS" -ne 200 ]; then echo "Reconcile failed"; exit 1; fi
