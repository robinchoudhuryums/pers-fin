# Weekly self-healing reconcile — out-of-process guarantee.
# The in-process scheduler runs reconcileTeller(90) at most weekly, but only
# while the Render process is awake; this workflow guarantees the heal fires
# regardless. All writes are idempotent ON CONFLICT upserts (INV-05), the
# Teller watermark is never advanced, and the anomaly push is suppressed —
# so overlapping with an in-process run is harmless.
# Requires repo secrets: SERVER_URL, API_KEY (same as daily-sync.yml).

name: Weekly Reconcile

on:
  schedule:
    - cron: '0 9 * * 0'   # Sundays 9 AM UTC
  workflow_dispatch:

# Read-only token: nothing here writes to the repository (cycle-7 F16).
permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # PUBLIC-LOG SAFETY (F2): this repo's Actions logs are world-readable
    # while the repo is public, so response bodies are never printed — they
    # carry account names, balances, net worth and merchant names. SUMMARY_JS
    # prints only the listed keys: numbers/booleans as-is, arrays as a count,
    # strings only when the key is suffixed ":str". Details live in the app
    # (Settings -> Sync Health).
    env:
      SERVER_URL: ${{ secrets.SERVER_URL }}
      API_KEY: ${{ secrets.API_KEY }}
      # CHECK_STATUS reports a curl timeout or unreachable server ("000") as an
      # error annotation instead of the step dying silently under `bash -e`
      # (Batch 3 follow-on). Usage: check_status <label> <status> [expected…]
      CHECK_STATUS: |
        check_status() {
          local label="$1" status="$2"; shift 2
          if [ "$status" = "000" ]; then
            echo "::error::$label: no response (timed out or server unreachable). The server may still be working."
            return 1
          fi
          for ok in "${@:-200}"; do [ "$status" = "$ok" ] && { echo "$label: HTTP $status"; return 0; }; done
          echo "::error::$label failed with HTTP $status"
          return 1
        }
      # Cycle-7 ST1: the two long calls run IN THE BACKGROUND on the server.
      # run_background POSTs {"background": true} (202 + a job id; 409 = one
      # is already running, which it then follows), polls
      # /perfin/api/sync/status?kind=<kind> every BG_POLL_SECONDS (15) for up to
      # BG_DEADLINE_SECONDS (1200), and fails the step when the job reports an
      # error, the server lost it (its id is gone — a restart), or the deadline
      # passes. A single request held open for the whole sync used to fail on
      # cold starts and long Plaid walks while the sync was still running.
      # The final status JSON lands in <out>; print it only through SUMMARY_JS.
      # Usage: run_background <label> <path> <kind> <out> <json body>
      RUN_BACKGROUND: |
        run_background() {
          local label="$1" path="$2" kind="$3" out="$4" body="$5"
          local status id state deadline
          status=$(curl -s -o /tmp/bg-start.json -w "%{http_code}" --max-time 90 \
            -X POST "$SERVER_URL$path" -H "x-api-key: $API_KEY" \
            -H "Content-Type: application/json" -d "$body") || true
          if [ "$status" = "409" ]; then
            echo "$label: a run is already in progress on the server; following it"
          elif [ "$status" != "202" ]; then
            check_status "$label (start)" "$status" || return 1
            echo "::error::$label: expected 202 (started), got HTTP $status"
            return 1
          fi
          id=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync("/tmp/bg-start.json","utf8"));process.stdout.write(String(d.id ?? ""))}catch{}' || true)
          deadline=$((SECONDS + ${BG_DEADLINE_SECONDS:-1200}))
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep "${BG_POLL_SECONDS:-15}"
            status=$(curl -s -o "$out" -w "%{http_code}" --max-time 30 \
              "$SERVER_URL/perfin/api/sync/status?kind=$kind" -H "x-api-key: $API_KEY") || true
            if [ "$status" != "200" ]; then echo "$label: status check HTTP $status, retrying"; continue; fi
            state=$(node -e '
              const [file, id] = process.argv.slice(1);
              let j;
              try { j = JSON.parse(require("fs").readFileSync(file, "utf8")); } catch { console.log("unknown"); process.exit(0); }
              if (id && String(j.id) !== id) console.log("lost");
              else if (j.running) console.log("running");
              else if (j.error) console.log("error");
              else console.log("done");' "$out" "$id" || echo unknown)
            case "$state" in
              done) echo "$label: finished"; return 0 ;;
              error) echo "::error::$label failed on the server. See Settings -> Sync Health."; return 1 ;;
              lost) echo "::error::$label: the server lost the run (restarted?). See Settings -> Sync Health."; return 1 ;;
              *) echo "$label: $state" ;;
            esac
          done
          echo "::error::$label: still running after $(( ${BG_DEADLINE_SECONDS:-1200} / 60 )) minutes. It may still finish; see Settings -> Sync Health."
          return 1
        }
      SUMMARY_JS: |
        const fs = require("fs");
        const [file, ...keys] = process.argv.slice(1);
        let d;
        try { d = JSON.parse(fs.readFileSync(file, "utf8")); } catch { console.log("(no JSON body)"); process.exit(0); }
        for (const k of keys) {
          const str = k.endsWith(":str");
          const path = (str ? k.slice(0, -4) : k).split(".");
          let v = d;
          for (const p of path) v = v && typeof v === "object" ? v[p] : undefined;
          const name = path.join(".");
          if (Array.isArray(v)) console.log(name + ": " + v.length);
          else if (typeof v === "number" || typeof v === "boolean") console.log(name + ": " + v);
          else if (str && typeof v === "string") console.log(name + ": " + v.slice(0, 40));
        }
    steps:
      - name: Wake server (Render free tier cold start)
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SERVER_URL }}/health" || true
          sleep 10

      - name: Reconcile trailing 90 days (Teller)
        run: |
          # Background reconcile + polling (ST1) — the old single request
          # (held open up to 9 minutes) died with the job still running.
          eval "$CHECK_STATUS"
          eval "$RUN_BACKGROUND"
          RC=0
          run_background "Reconcile" /perfin/api/sync/reconcile reconcile /tmp/reconcile.json '{"days": 90, "provider": "teller", "background": true}' || RC=$?
          node -e "$SUMMARY_JS" /tmp/reconcile.json result.days result.provider:str result.teller.enrollments_synced result.teller.transactions_added result.teller.errors
          exit $RC
