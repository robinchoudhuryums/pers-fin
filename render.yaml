# Render deployment blueprint for pers-fin subscription tracker
# Deploy: Connect GitHub repo in Render dashboard, or `render blueprint apply`
#
# After deploy, set these env vars in the dashboard:
#   TELLER_CERT — base64-encoded certificate.pem  (run: base64 < certificate.pem)
#   TELLER_KEY  — base64-encoded private_key.pem   (run: base64 < private_key.pem)

services:
  - type: web
    name: pers-fin-tracker
    runtime: node
    plan: free
    buildCommand: cd teller && npm install && cd .. && npm install
    startCommand: node teller/server.js
    envVars:
      - key: PORT
        value: 3000
      - key: TELLER_CERT
        sync: false  # base64-encoded certificate.pem
      - key: TELLER_KEY
        sync: false  # base64-encoded private_key.pem
      - key: TELLER_ENV
        value: development
      - key: TELLER_APPLICATION_ID
        sync: false  # set manually in dashboard
      - key: NEON_DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_PASSPHRASE
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
