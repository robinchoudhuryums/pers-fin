<!DOCTYPE html>
<!-- Unused in normal operation: capacitor.config.json server.url points the
     WebView at the live deployment. This stub only renders if the remote URL
     is unreachable at cold start (no network + nothing cached). -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Perfin</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #080b12; color: #f0ebe3; font-family: -apple-system, system-ui, sans-serif; }
    .box { text-align: center; padding: 24px; }
    .box p { color: rgba(240,235,227,0.7); font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Perfin</h1>
    <p>Couldn't reach the server. Check your connection, then relaunch.</p>
  </div>
</body>
</html>
