<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline — Perfin</title>
  <style>
    :root { color-scheme: dark light; }
    html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d10; color: #e6e6e6; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
    .logo { width: 96px; height: 96px; margin-bottom: 24px; opacity: 0.85; }
    h1 { font-size: 28px; margin: 0 0 8px; font-weight: 400; letter-spacing: -0.5px; }
    .subtitle { font-size: 15px; color: #888; margin: 0 0 32px; max-width: 460px; }
    .retry { display: inline-block; padding: 12px 24px; font-size: 14px; border: 1px solid #2a2f36; border-radius: 10px; background: transparent; color: #e6e6e6; cursor: pointer; font-family: inherit; min-height: 44px; min-width: 120px; }
    .retry:hover { border-color: #4a5056; background: #141820; }
    .footer { font-size: 11px; color: #555; margin-top: 24px; max-width: 420px; }
    @media (prefers-color-scheme: light) {
      html, body { background: #fafafa; color: #222; }
      .retry { border-color: #d5d9de; color: #222; }
      .retry:hover { border-color: #adb5bd; background: #eef0f3; }
      .subtitle { color: #666; } .footer { color: #999; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/logo.svg" alt="Perfin" onerror="this.style.display='none'">
    <h1>You're offline</h1>
    <p class="subtitle">Perfin can't reach the server right now. Your data lives in the cloud, so live balances and transactions need a connection.</p>
    <button class="retry" onclick="location.reload()">Retry</button>
    <p class="footer">If this persists, the app is still installable on your home screen and will reconnect automatically when you come back online.</p>
  </div>
</body>
</html>
